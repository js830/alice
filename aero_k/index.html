<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--jquery 라이브러리-->
    <script src="js/jquery-3.7.1.min.js"></script>

    <!--swiper 라이브러리-->
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <title>aero_k</title>
</head>
<body>
    <div id="wrap">
        <header>
            <div class="wrapper">
                <h1 class="logo"><a href="#"><img src="images/common/logo.png" alt="aero_k"></a></h1>
                <nav class="gnb">
                    <ul>
                        <li><a href="#">항공권 예약</a></li>
                        <li><a href="#">나의 예매</a></li>
                        <li><a href="#">서비스 안내</a></li>
                        <li><a href="#">이벤트</a></li>
                        <li><a href="#">공지사항</a></li>
                    </ul>
                </nav>
                <div class="util">
                    <a href="#" class="search"><span class="blind">검색</span></a>
                    <a href="#" class="mypage"><span class="blind">마이페이지</span></a>
                </div>
            </div>
        </header>
        <main class="container">
            <section class="visual">
                <div class="wrapper">
                    <h2>Elevate your<br>journey with Aero_K.</h2>
                </div>
            </section>
        </main>
        <section class="reservation">
            <div class="wrapper">
                <div class="inner">
                    <div class="tit">
                        <button class="active">왕복</button>
                        <button>편도</button>
                        <button>다구간</button>
                    </div>
                    <div class="list">
                        <span class="start">서울(모든공항)</span>
                        <span class="end">도착지</span>
                        <span class="date">날짜</span>
                    </div>
                </div>
            </div>
        </section>
        <section class="event">
            <div class="wrapper">
                <div class="tit">
                    <h2>Aero_k 이벤트</h2>
                </div>
                <div class="list">
                    <ul>
                        <li class="bg01">
                            <a href="#">
                                <strong>홋카이도 할인 프로모션</strong>
                                <h3>청주<br>삿포로 오비히로</h3>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="list">
                    <ul>
                        <li class="bg02">
                            <a href="#">
                                <strong>주 4회 단독운항</strong>
                                <h3>청주<br>히로시마</h3>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="list">
                    <ul>
                        <li class="bg03">
                            <a href="#">
                                <strong>매일 단독운항</strong>
                                <h3>청주<br>칭다오</h3>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </section>
        <footer></footer>
    </div>
</body>
</html>
